[project]
name = "jingwei-workbench"
version = "0.1.0"
description = "本地运行、证据可追溯的咨询研究与写稿工作台"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller==6.22.2"]

[project.scripts]
jingwei = "app.desktop:main"
jingwei-cli = "app.cli:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
app = ["migrations/*.sql", "templates/*/*.json"]

[tool.unittest]
start-directory = "tests"
