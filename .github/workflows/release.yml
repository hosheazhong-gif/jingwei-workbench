name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows release assets
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build dependency
        run: python -m pip install -r requirements-build.txt
      - name: Build and smoke-test executable
        run: python scripts/build_windows_app.py
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            dist/Jingwei.exe
            dist/Jingwei.exe.sha256
            dist/Jingwei-Windows-x64-*.zip
            dist/Jingwei-Windows-x64-*.zip.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "经纬 $GITHUB_REF_NAME"
          --generate-notes
