name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.shard_label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
            shard_index: 0
            shard_count: 1
            shard_label: all tests
          - os: windows-latest
            python: "3.11"
            shard_index: 0
            shard_count: 4
            shard_label: shard 1 of 4
          - os: windows-latest
            python: "3.11"
            shard_index: 1
            shard_count: 4
            shard_label: shard 2 of 4
          - os: windows-latest
            python: "3.11"
            shard_index: 2
            shard_count: 4
            shard_label: shard 3 of 4
          - os: windows-latest
            python: "3.11"
            shard_index: 3
            shard_count: 4
            shard_label: shard 4 of 4

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python sources
        run: python -m compileall -q app scripts tests
      - name: Check browser JavaScript syntax
        run: node --check frontend/report/app.js
      - name: Run automated tests
        run: >-
          python scripts/run_test_shard.py
          --index ${{ matrix.shard_index }}
          --count ${{ matrix.shard_count }}

  package-windows:
    name: Build and smoke-test Windows app
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build dependency
        run: python -m pip install -r requirements-build.txt
      - name: Build and smoke-test executable
        run: python scripts/build_windows_app.py
      - uses: actions/upload-artifact@v7
        with:
          name: Jingwei-Windows-x64
          path: |
            dist/Jingwei.exe
            dist/Jingwei.exe.sha256
            dist/Jingwei-Windows-x64-*.zip
            dist/Jingwei-Windows-x64-*.zip.sha256
          if-no-files-found: error
          compression-level: 0
